[package]
name = "md4c-rs"
version = "0.5.2"
edition = "2021"
rust-version = "1.70"
authors = ["failspy"]
description = "Safe Rust bindings for MD4C, a fast CommonMark-compliant Markdown parser"
license = "MIT"
repository = "https://github.com/failspy/md4c"
homepage = "https://github.com/failspy/md4c"
keywords = ["markdown", "parser", "commonmark", "md4c"]
categories = ["parsing", "text-processing"]
readme = "README.md"
links = "md4c"
include = [
    "src/**/*.rs",
    "vendor/*.c",
    "vendor/*.h",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE.md",
    "benches/**/*.rs",
]

[lib]
name = "md4c"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "parsing"
harness = false

[features]
default = ["html"]
html = []
