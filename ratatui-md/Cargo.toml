[package]
name = "ratatui-md"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["failspy"]
description = "Markdown rendering for ratatui terminal UIs using MD4C"
license = "MIT"
repository = "https://github.com/failspy/md4c-rs"
homepage = "https://github.com/failspy/md4c-rs"
documentation = "https://docs.rs/ratatui-md"
keywords = ["ratatui", "tui", "markdown", "widget", "terminal"]
categories = ["command-line-interface", "text-processing"]
readme = "README.md"

[dependencies]
md4c-rs = { workspace = true }
cadenza-anchor = { workspace = true }
ratatui = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }

# Optional: syntax highlighting for code blocks
syntect = { workspace = true, optional = true }

[dev-dependencies]
crossterm = { workspace = true }

[features]
default = []
syntect = ["dep:syntect"]

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "scrollable"
path = "examples/scrollable.rs"
